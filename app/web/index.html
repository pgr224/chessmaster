<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chess Master - A premium chess experience with multiplayer, AI, and stunning themes.">
  <meta property="og:title" content="Chess Master">
  <meta property="og:description" content="Play Chess Master online. Elegant themes, real-time multiplayer, and clever AI.">
  <meta property="og:image" content="icons/Icon-192.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chess Master">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chess Master</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="install_prompt.css">
</head>
<body>
  <!-- Install Prompt Logic -->
  <script src="install_prompt.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(async reg => {
            console.log('✅ Service Worker Registered:', reg.scope);
            await initPushBootstrap(reg);
          })
          .catch(err => console.log('❌ Service Worker Registration Fail:', err));
      });
    }

    async function initPushBootstrap(registration) {
      if (!('PushManager' in window) || !('Notification' in window)) {
        return;
      }

      if (Notification.permission === 'default') {
        try {
          await Notification.requestPermission();
        } catch (_) {}
      }

      if (Notification.permission !== 'granted') {
        return;
      }

      const token = readStoredValue('auth_token');
      const userDataRaw = readStoredValue('user_data');
      const userData = parsePossiblyEncodedJson(userDataRaw);
      const userId = userData && userData.id ? userData.id : null;

      if (!token || !userId) {
        return;
      }

      const apiBase = 'https://chess-master-api.pp942920.workers.dev';

      let vapidKey = null;
      try {
        const keyRes = await fetch(`${apiBase}/api/push/vapid-public-key`);
        if (!keyRes.ok) return;
        const keyJson = await keyRes.json();
        vapidKey = keyJson.publicKey;
      } catch (_) {
        return;
      }

      if (!vapidKey) return;

      try {
        let sub = await registration.pushManager.getSubscription();
        if (!sub) {
          sub = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapidKey),
          });
        }

        await fetch(`${apiBase}/api/push/subscribe`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({
            userId,
            deviceId: 'web',
            subscription: sub,
          }),
        });
      } catch (e) {
        console.log('Push bootstrap skipped:', e);
      }
    }

    function readStoredValue(key) {
      const direct = localStorage.getItem(key);
      const flutter = localStorage.getItem(`flutter.${key}`);
      return direct || flutter;
    }

    function parsePossiblyEncodedJson(raw) {
      if (!raw) return null;
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed === 'string') {
          return JSON.parse(parsed);
        }
        return parsed;
      } catch (_) {
        return null;
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Chess Engine Service (loaded before Flutter for JS interop) -->
  <script src="engine/sunfish_engine.js"></script>
  <script src="engine/chess_logic.js"></script>
  <script src="engine/engine_service.js"></script>

  <script src="flutter_bootstrap.js" type="module"></script>
</body>
</html>
