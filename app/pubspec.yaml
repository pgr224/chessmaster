name: chess_master
description: Production-ready Chess App — FIDE compliant, AI-powered, multiplayer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  go_router: ^17.1.0
  dio: ^5.5.4
  get_it: ^9.2.1
  web_socket_channel: ^3.0.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.2.3
  device_info_plus: ^12.3.0
  network_info_plus: ^7.0.0
  connectivity_plus: ^7.0.0
  leela_chess_zero: ^1.0.0
  stockfish: ^1.8.1
  chess: ^0.8.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  audioplayers: ^6.1.0
  vibration: ^3.1.8
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  confetti: ^0.8.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.0
  intl: ^0.20.2
  uuid: ^4.4.0
  crypto: ^3.0.3
  jwt_decoder: ^2.0.1
  flutter_dotenv: ^6.0.0
  google_fonts: ^8.0.2
  flutter_speed_dial: ^7.0.0
  timeline_tile: ^2.0.0
  percent_indicator: ^4.2.3
  fl_chart: ^1.2.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  image_cropper: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.1
  build_runner: ^2.4.9
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

