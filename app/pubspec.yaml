name: chess_master
description: Production-ready Chess App — FIDE compliant, AI-powered, multiplayer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  go_router: ^14.0.1
  dio: ^5.5.4
  get_it: ^7.7.0
  web_socket_channel: ^3.0.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.0
  network_info_plus: ^5.0.0
  connectivity_plus: ^6.0.3
  stockfish: ^1.1.0
  chess: ^0.8.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  audioplayers: ^6.1.0
  vibration: ^2.0.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  confetti: ^0.8.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  jwt_decoder: ^2.0.1
  flutter_dotenv: ^5.1.0
  google_fonts: ^8.0.2
  flutter_speed_dial: ^7.0.0
  timeline_tile: ^2.0.0
  percent_indicator: ^4.2.3
  fl_chart: ^1.2.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  image_cropper: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_ce_generator: ^1.11.1
  build_runner: ^2.4.9
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/pieces/classic/
    - assets/pieces/neo/
    - assets/pieces/wood/
    - assets/pieces/neon/
    - assets/sounds/
    - assets/images/
    - assets/animations/
    - assets/themes/
    - assets/tutorials/
    - .env
