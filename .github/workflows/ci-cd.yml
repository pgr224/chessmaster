name: CI & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'app/**'
  pull_request:
    branches: [main]
    paths: ['app/**']

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.changed_files, 'backend/')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply chess-master-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  test-and-build:
    runs-on: ubuntu-latest
    if: contains(github.changed_files, 'app/') || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign
        if: runner.os == 'macOS'

      - name: Build Web (for Cloudflare Pages)
        run: flutter build web --release --web-renderer canvaskit

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web

  deploy-web:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chess-master
          directory: web-build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
